services:
  url_shortener_nginx:
    image: docker-public.paradisestation.org/paradise/paraphp:20261021.205704-fd6e3dd
    container_name: url_shortener_nginx
    restart: unless-stopped

    ports:
      - "8082:8080"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - urlshortenernginx-webroot:/var/www/html

    networks:
      internal:
        ipv4_address: 172.28.0.20

volumes:
  urlshortenernginx-webroot:
