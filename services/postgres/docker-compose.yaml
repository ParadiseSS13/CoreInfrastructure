services:
  postgres:
    image: postgres:18.4-trixie
    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    networks:
      internal:
        ipv4_address: 172.28.0.9


    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    shm_size: 256m

volumes:
  postgres_data:
