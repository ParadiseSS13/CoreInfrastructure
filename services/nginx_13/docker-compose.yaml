services:
  nginx_13:
    image: docker-public.paradisestation.org/paradise/paraphp:20261111.214057-f9d1d03
    container_name: nginx_13
    restart: unless-stopped

    ports:
      - "8087:8080"

    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx13-webroot:/var/www/html
      - /mnt/espresso_assets:/var/www/html/espresso_assets:ro

    networks:
      internal:
        ipv4_address: 172.28.0.27

volumes:
  nginx13-webroot:
