services:
  nginx_13:
    image: docker-public.paradisestation.org/paradise/paraphp:20260831.202458-464e6d9
    container_name: nginx_13
    restart: unless-stopped

    ports:
      - "8087:8080"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx13-webroot:/var/www/html
      - /mnt/espresso_assets:/var/www/html/espresso_assets:ro

    networks:
      internal:
        ipv4_address: 172.28.0.27

volumes:
  nginx13-webroot:
