services:
  prs_api:
    image: docker-internal.paradisestation.org/paradise/prs-api:20261122.232731-74ef79e
    container_name: prs_api
    ports:
      - "8086:8086"

    restart: unless-stopped

    environment:
      PORT: 8086
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_AUDIENCE: ${APP_JWT_AUDIENCE}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_ACCOUNT_TOKEN: ${GITHUB_ACCOUNT_TOKEN}
      DBHOST: ${DBHOST}
      DBUSER: ${DBUSER}
      DBPASS: ${DBPASS}
      DBDB: ${DBDB}
      PGDBHOST: ${PGDBHOST}
      PGDBUSER: ${PGDBUSER}
      PGDBPASS: ${PGDBPASS}
      PGDBDB: ${PGDBDB}
      DISCORD_WEBHOOK_WIKI: ${DISCORD_WEBHOOK_WIKI}
      DISCORD_WEBHOOK_ADMIN: ${DISCORD_WEBHOOK_ADMIN}
      BYOND_SERVER: ${BYOND_SERVER}
      BYOND_PORT: ${BYOND_PORT}
      BYOND_COMMSKEY: ${BYOND_COMMSKEY}

    networks:
      internal:
        ipv4_address: 172.28.0.26

