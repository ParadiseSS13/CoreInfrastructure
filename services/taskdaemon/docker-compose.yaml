services:
  taskdaemon:
    image: docker-public.paradisestation.org/paradise/taskdaemon:20260827.195911-7bc2d2a
    container_name: taskdaemon
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.28.0.6

    configs:
      - source: taskdaemon
        target: /app/config.toml

configs:
  taskdaemon:
    file: ./config.toml
