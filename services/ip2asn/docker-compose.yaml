services:
  ip2asn:
    image: docker-public.paradisestation.org/jedisct1/iptoasn-webservice:20260802.191411-fe10ce3
    container_name: iptoasn
    restart: unless-stopped
    ports:
      - "53661:53661"

    environment:
      - RUST_LOG=info
      - IPTOASN_PORT=53661

    networks:
      internal:
        ipv4_address: 172.28.0.3
