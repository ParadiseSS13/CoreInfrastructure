services:
  nginx_14:
    image: docker-public.paradisestation.org/paradise/paraphp:20261111.214057-f9d1d03
    container_name: nginx_14
    restart: unless-stopped

    ports:
      - "8085:8080"

    volumes:
      - nginx14-webroot:/var/www/html

    networks:
      internal:
        ipv4_address: 172.28.0.25

volumes:
  nginx14-webroot:
