services:
  tools_nginx:
    image: docker-public.paradisestation.org/paradise/paraphp:20260831.202458-464e6d9
    container_name: tools_nginx
    restart: unless-stopped

    ports:
      - "8085:8080"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx14-webroot:/var/www/html

    networks:
      internal:
        ipv4_address: 172.28.0.19

volumes:
  nginx14-webroot:
