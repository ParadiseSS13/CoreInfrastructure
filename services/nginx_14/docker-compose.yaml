services:
  nginx_14:
    image: docker-public.paradisestation.org/paradise/paraphp:20261021.205704-fd6e3dd
    container_name: nginx_14
    restart: unless-stopped

    ports:
      - "8085:8080"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx14-webroot:/var/www/html

    networks:
      internal:
        ipv4_address: 172.28.0.25

volumes:
  nginx14-webroot:
