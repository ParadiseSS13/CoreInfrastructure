services:
  mediawiki_core:
    image: docker-public.paradisestation.org/paradise/parawiki:20260809.192856-b81573b
    container_name: mediawiki_core
    restart: unless-stopped
    # Sync baked assets into shared export volumes on startup, then launch php-fpm
    command: >
      sh -c "cp -a /var/www/html/skins/. /export/skins/ &&
             cp -a /var/www/html/extensions/. /export/extensions/ &&
             cp -a /var/www/html/resources/. /export/resources/ &&
             exec php-fpm"

    ports:
      - "9100:9100" # exposed for monitoring

    volumes:
      - ./LocalSettings.php:/var/www/html/LocalSettings.php:ro
      - mediawiki-images:/var/www/html/images
      - mediawiki-skins:/export/skins
      - mediawiki-extensions:/export/extensions
      - mediawiki-resources:/export/resources

    networks:
      internal:
        ipv4_address: 172.28.0.15

  mediawiki_nginx:
    image: nginx:1.30.4-trixie
    container_name: mediawiki_nginx
    restart: unless-stopped

    ports:
      - "9200:9200"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - mediawiki-images:/var/www/html/images:ro
      - mediawiki-skins:/var/www/html/skins:ro
      - mediawiki-extensions:/var/www/html/extensions:ro
      - mediawiki-resources:/var/www/html/resources:ro
    depends_on:
      - mediawiki_core

    networks:
      internal:
        ipv4_address: 172.28.0.16

volumes:
  mediawiki-images:
  mediawiki-skins:
  mediawiki-extensions:
  mediawiki-resources:
