services:
  ytdlp:
    build:
      context: https://github.com/AffectedArc07/ss13-yt-wrap.git#patch-1
      dockerfile: Dockerfile
    container_name: ytdlp
    restart: unless-stopped
    ports:
      - "33432:33432"

    environment:
      - YTDLP_PORT=33432

    networks:
      internal:
        ipv4_address: 172.28.0.5
