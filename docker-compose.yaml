name: paradise
include:
  # IP2ASN Helper
  - services/ip2asn/docker-compose.yaml
  # Nginx Proxy Manager
  - services/nginx_proxy_manager/docker-compose.yaml
  # Valkey
  - services/valkey/docker-compose.yaml
  # YTDLP
  - services/ytdlp/docker-compose.yaml
networks:
  # We are statically allocating IPs to ensure they never change. This lets us sidestep issues with DNS caching
  # 0.1: gateway
  # 0.2: nginxpm       80    81   443
  # 0.3: ip2asn     53661
  # 0.4: valkey      6379
  # 0.5: ytdlp      33432
  internal:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
